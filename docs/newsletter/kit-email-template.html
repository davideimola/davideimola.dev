<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light">
    <title>Davide Imola Newsletter</title>
    <style type="text/css">
        :root { color-scheme: light only; supported-color-schemes: light; }
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
        a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
        @media screen and (max-width: 600px) {
            .email-container { width: 100% !important; }
            .mobile-padding { padding: 24px 16px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F7F5F0; font-family: 'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
    <center style="width: 100%; background-color: #F7F5F0;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="margin: 0 auto;" class="email-container">

            <tr>
                <td style="padding: 40px 20px 30px; text-align: center; border-bottom: 1px solid #DEDCD5;">
                    <a href="https://davideimola.dev" target="_blank" style="text-decoration: none;"><img src="https://www.davideimola.dev/brand/lockup-1200.png" width="180" height="35" alt="Davide Imola" style="display: block; margin: 0 auto; width: 180px; height: 35px; border: 0;"></a>
                </td>
            </tr>

            <tr>
                <td style="padding: 30px 20px;" class="mobile-padding">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                        <tr>
                            <td style="font-family: 'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.65; color: #2A3042;">
                                {{ message_content }}
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr>
                <td style="padding: 30px 20px; border-top: 1px solid #DEDCD5; text-align: center;">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                        <tr>
                            <td style="font-family: 'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.5; color: #5B6070; text-align: center; padding-bottom: 12px;">
                                What you learn, you must share.
                            </td>
                        </tr>
                        <tr>
                            <td style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 1.6; color: #5B6070; text-align: center; padding-bottom: 8px;">
                                <a href="https://github.com/davideimola" target="_blank" style="color: #1C2233; text-decoration: none;">GitHub</a>
                                <span style="color: #5B6070;"> · </span>
                                <a href="https://linkedin.com/in/davideimola" target="_blank" style="color: #1C2233; text-decoration: none;">LinkedIn</a>
                                <span style="color: #5B6070;"> · </span>
                                <a href="https://davideimola.dev" target="_blank" style="color: #1C2233; text-decoration: none;">davideimola.dev</a>
                            </td>
                        </tr>
                        <tr>
                            <td style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 1.6; color: #5B6070; text-align: center;">
                                <a href="{{ unsubscribe_url }}" target="_blank" style="color: #5B6070; text-decoration: underline;">Unsubscribe</a>
                                <span style="color: #5B6070;"> · </span>
                                <a href="https://davideimola.dev/privacy" target="_blank" style="color: #5B6070; text-decoration: underline;">Privacy</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

        </table>
    </center>
</body>
</html>
