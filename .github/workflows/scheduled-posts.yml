name: Scheduled posts

# A post merged before its publishDate stays hidden in production
# (isPublished in src/lib/content.ts), but the pages are built ahead of time:
# nothing shows it on its date until the site is built again. This job runs
# just after midnight in Rome and, only when a post is due today and /blog
# does not list it yet, asks Vercel for a fresh production deploy through a
# deploy hook. GitHub can start a scheduled run hours late, so a second run in
# the morning is the backup, and it finds the post already live when the first
# one worked. Days without a post cost a checkout and a grep, never a deploy.
#
# Setup: create a Deploy Hook for the main branch in Vercel (Project Settings,
# Git, Deploy Hooks) and save its URL as the VERCEL_DEPLOY_HOOK repository
# secret. The URL triggers deploys by itself, so it lives only in the secret.

on:
  schedule:
    # 23:15 UTC is 00:15 or 01:15 in Rome, already the day the post is due.
    - cron: "15 23 * * *"
    # The backup: 06:00 or 07:00 in Rome, the same calendar day.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-due-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find posts due today
        id: due
        run: |
          today=$(TZ=Europe/Rome date +%F)
          due=""
          for f in src/content/blog/*.mdx; do
            # Only the frontmatter, between the first two --- lines.
            front=$(awk 'NR==1 && /^---$/ {open=1; next} open && /^---$/ {exit} open' "$f")
            date=$(printf '%s\n' "$front" | sed -nE 's/^publishDate:[[:space:]]*"?([0-9]{4}-[0-9]{2}-[0-9]{2})"?.*/\1/p')
            if [ "$date" = "$today" ] && ! printf '%s\n' "$front" | grep -qE '^draft:[[:space:]]*true'; then
              due="$due $(basename "$f" .mdx)"
            fi
          done
          echo "Today in Rome: $today. Due:${due:- none}"

          # /blog is static and changes only with a deploy (a post page can
          # render on demand before one), so it says whether a deploy already
          # took the post live today.
          missing=""
          if [ -n "$due" ]; then
            index=$(curl --fail --silent --show-error --location https://davideimola.dev/blog || true)
            for slug in $due; do
              printf '%s' "$index" | grep -q "blog/$slug" || missing="$missing $slug"
            done
            echo "Not on /blog yet:${missing:- none}"
          fi
          echo "due=${missing# }" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.due.outputs.due != ''
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set, so ${{ steps.due.outputs.due }} will not go live today."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$HOOK" > /dev/null
          echo "Deploy requested for: ${{ steps.due.outputs.due }}" >> "$GITHUB_STEP_SUMMARY"
